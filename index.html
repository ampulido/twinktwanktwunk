              <div class="row" style="justify-content:flex-start;gap:6px">
                <span>${item.included ? '✅' : '⬜'}</span>
                <b style="font-size:13px">${esc(exo?.name || item.exerciseId)}</b>
              </div>
              <div class="tiny" style="margin-top:4px">${st?.emoji || '🏋️'} ${esc(exo?.station || '')} · ${fmt(exo?.restSec || 90)} ${prioBadge}</div>
            </div>
            <div class="row" style="gap:4px">
              <button class="btn small" onclick="moveDraft(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>↑</button>
              <button class="btn small" onclick="moveDraft(${idx}, 1)" ${idx === d.items.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="btn soft small" onclick="openSwapDraftModal(${idx})">🔄 Ocupada</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <button class="btn primary block" onclick="startDraft()">Empezar entreno (${activeCount} máquinas)</button>
  `;
}

function renderTrain() {
  if (state.draft) return renderSessionMap();

  if (!state.active) {
    const roast = ROASTS[new Date().getDate() % ROASTS.length];
    return `
      <div class="row">
        <div>
          <div class="eyebrow">Plan Full Body A/B/C</div>
          <h1 class="title">¿Qué toca hoy?</h1>
        </div>
        <button class="btn ${state.quick ? 'soft' : ''}" onclick="state.quick=!state.quick;render()">
          ⚡ ${state.quick ? 'Modo 20 min ON' : 'Tengo 20 min'}
        </button>
      </div>
      <div class="card" style="background:var(--panel2);padding:12px 14px">
        <div class="tiny" style="color:var(--purple);font-weight:700">💬 ${esc(roast)}</div>
      </div>
      ${state.history.length ? (() => {
        const last = state.history.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
        return `<button class="btn soft block" onclick="repeatLastWorkout()">🔁 Repetir último: ${esc(last.title)} (${esc(last.date)})</button>`;
      })() : ''}
      <div class="stack">
        ${ROUTINES.map(r => `
          <section class="card stack">
            <div class="row">
              <span class="eyebrow">${esc(r.club)}</span>
              <span class="tiny">${state.quick ? r.short.length : r.all.length} estaciones</span>
            </div>
            <div>
              <strong style="font-size:16px">${esc(r.name)}</strong>
              <div class="muted" style="margin-top:2px">${esc(r.focus)}</div>
            </div>
            <button class="btn primary block" onclick="openRoutineMap('${r.id}')">Preparar mapa de sesión</button>
          </section>
        `).join('')}
        <button class="btn block" onclick="startFree()">＋ Entreno libre desde cero</button>
      </div>
    `;
  }

  const w = state.active;
  if (w.stale) {
    return `
      <section class="card stack">
        <div class="eyebrow">Sesión recuperada</div>
        <h2 class="title">¿Continuamos?</h2>
        <p class="muted">Esta sesión lleva más de dos días abierta.</p>
        <button class="btn primary" onclick="state.active.stale=false;state.active.startedAt=Date.now();save();render()">Continuar desde ahora</button>
        <button class="btn danger" onclick="discard()">Descartar sesión</button>
      </section>
    `;
  }

  if (!w.entries.length) {
    return `
      <section class="card focus stack">
        <div class="eyebrow">Entreno libre</div>
        <h2 class="title">Añade tu primera máquina</h2>
        <button class="btn primary" onclick="openStationPicker()">＋ Elegir estación o grupo</button>
        <button class="btn" onclick="discard()">Descartar sesión</button>
      </section>
    `;
  }

  const e = activeEntry();
  const exercise = ex(e.exerciseId);
  const s = activeSet();
  const total = w.entries.reduce((a, x) => a + x.sets.length, 0);
  const completed = w.entries.reduce((a, x) => a + x.sets.filter(y => y.done).length, 0);
  const allSetsDone = total > 0 && completed === total;
  const prev = lastSet(e.exerciseId);
  const st = STATIONS.find(x => x.id === exercise?.station);
  const isResting = Boolean(w.restDeadline || w.restPausedRemaining);

  let postRestBanner = '';
  if (w.restFinished && !isResting) {
    if (allSetsDone) {
      postRestBanner = `
        <div class="finished-banner">
          <span>🎉 ¡Todas las series listas! Ya puedes finalizar el entreno.</span>
          <button class="btn small" style="padding:4px 8px" onclick="state.active.restFinished=false;save();render()">✕</button>
        </div>
      `;
    } else {
      const nextStepText = exercise?.type === 'time'
        ? `${s?.seconds || 40} s`
        : exercise?.type === 'reps'
          ? `${s?.reps || 10} reps`
          : `${s?.weight || 15} kg × ${s?.reps || 10}`;
      postRestBanner = `
        <div class="finished-banner">
          <span>⏰ Descanso listo → Toca: Serie ${e.activeSetIndex + 1} · ${esc(exercise?.name || '')} (${nextStepText})</span>
          <button class="btn small" style="padding:4px 8px" onclick="state.active.restFinished=false;save();render()">✕</button>
        </div>
      `;
    }
  }

  return `
    <div class="row">
      <button class="btn small" onclick="moveExercise(-1)" ${w.currentIndex === 0 ? 'disabled' : ''}>←</button>
      <span class="muted" style="font-weight:750">Bloque ${w.currentIndex + 1}/${w.entries.length} · ${completed}/${total} series</span>
      <button class="btn small" onclick="moveExercise(1)" ${w.currentIndex === w.entries.length - 1 ? 'disabled' : ''}>→</button>
      <button class="btn small" onclick="exerciseOptions()">···</button>
    </div>

    ${postRestBanner}

    <section class="card focus stack">
      <div class="row">
        <span class="eyebrow">${st?.emoji || '🏋️'} ${esc(exercise?.station || 'Máquina')} · Desc. ${fmt(exercise?.restSec || 90)}</span>
        <button class="btn soft small" onclick="swapActiveExercise()">🔄 Ocupada</button>
      </div>
     <div class="exercise-name">${esc(exercise?.name || 'Ejercicio')}</div>
    <div role="button" style="${exercise?.note ? 'background:var(--panel2);border:1px solid #c4b5fd;border-radius:10px;padding:7px 10px;font-size:12px;' : 'font-size:11px;padding:4px 0;'}color:var(--purple);font-weight:750" onclick="editExercise('${esc(e.exerciseId)}')">📝 ${exercise?.note ? 'Ajuste: ' + esc(exercise.note) : 'Añadir ajuste (asiento, agarre…)'}</div>
      <div class="muted">${lastSessionSummary(e.exerciseId)}</div>
      ${exercise?.guide ? `
        <details class="guide-box">
          <summary>ℹ️ Técnica y ajuste (ver en 3 seg)</summary>
          <p>
            <b>Ajuste:</b> ${esc(exercise.guide.setup)}<br>
            <b>Ejecución:</b> ${esc(exercise.guide.execution)}<br>
            <b>Respiración:</b> ${esc(exercise.guide.breathing)}
          </p>
        </details>
      ` : ''}

      ${isResting ? renderRest(exercise, s, e, allSetsDone) : renderSetControls(exercise, s, e)}

      <div class="set-list">
        ${e.sets.map((x, i) => `
          <div class="set-row ${x.done ? 'done' : i === e.activeSetIndex ? 'active-row' : ''} ${x.pr ? 'pr' : ''}">
            <span>Serie ${i + 1}</span>
            <span>${setLabel(exercise, x, e, i)}</span>
            <span>${x.done ? (x.pr ? '🏆 Récord' : '✓ Hecha') : i === e.activeSetIndex ? 'Actual' : 'Pendiente'}</span>
          </div>
        `).join('')}
      </div>

      <div class="row">
        <button class="btn small" onclick="removeSet()" ${e.sets.length <= 1 ? 'disabled' : ''}>− Serie</button>
        <span class="tiny">${e.sets.length} series en este bloque</span>
        <button class="btn soft small" onclick="addSet()">＋ Serie</button>
      </div>
    </section>

    <div class="row">
      <span class="tiny">${w.currentIndex < w.entries.length - 1 ? `Siguiente: ${esc(ex(w.entries[w.currentIndex + 1].exerciseId)?.name || '')}` : 'Último bloque de hoy'}</span>
      <button class="btn soft small" onclick="openStationPicker()">＋ Añadir máquina</button>
    </div>
    <button class="btn primary block" onclick="finishWorkout()">Finalizar entreno</button>
  `;
}

function renderSetControls(exercise, s, e) {
  if (!s || s.done) return '<p class="muted">Bloque completado ✓ · usa ＋ Serie si quieres otra.</p>';
  if (exercise?.type === 'time') {
    return `
      <div class="rest">
        <div class="eyebrow">Cronómetro isométrico</div>
        <div id="plank-live" class="digits">${s.timerRunning ? Math.floor(s.accumulatedSec + (Date.now() - s.timerStartedAt) / 1000) + ' s' : (s.accumulatedSec || 0) + ' s'}</div>
        <div class="row">
          <button class="btn" onclick="togglePlank()">${s.timerRunning ? '⏸ Pausar' : '▶️ Iniciar'}</button>
          <button class="btn" onclick="resetPlank()">Reiniciar</button>
        </div>
      </div>
      <button class="btn primary block" onclick="saveSet()">Guardar serie</button>
    `;
  }
  if (exercise?.type === 'reps') {
    return `
      <div class="step">
        <label>Repeticiones rápidas</label>
        <div class="chips" style="margin-bottom:8px">
          ${[8, 10, 12, 15, 20].map(r => `<button class="chip ${s.reps === r ? 'active' : ''}" onclick="setReps(${r})">${r}</button>`).join('')}
        </div>
        <div class="row">
          <button class="btn small" onclick="adjustSet('reps', -1)">−1</button>
          <strong style="font-size:20px">${s.reps} reps</strong>
          <button class="btn small" onclick="adjustSet('reps', 1)">+1</button>
        </div>
      </div>
      ${ghostButton(exercise, e, s)}
      <button class="btn primary block" onclick="saveSet()">Guardar serie</button>
    `;
  }
  return `
    <div class="step-grid">
      <div class="step">
        <label>Peso (kg)</label>
        <input class="weight-input" type="number" inputmode="decimal" step="0.5" min="0"
          value="${s.weight}" aria-label="Peso en kilos"
          oninput="editSet('weight', this.value)"
          onchange="propagateWeight(this.value)">
      </div>
      <div class="step">
        <label>Repeticiones</label>
        <div class="chips">
          ${[6, 8, 10, 12, 15].map(r => `<button class="chip ${s.reps === r ? 'active' : ''}" onclick="setReps(${r})">${r}</button>`).join('')}
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn small" onclick="adjustSet('reps', -1)">−</button>
          <strong style="font-size:15px">${s.reps}</strong>
          <button class="btn small" onclick="adjustSet('reps', 1)">+</button>
        </div>
      </div>
    </div>
    ${ghostButton(exercise, e, s)}
    <button class="btn primary block" onclick="saveSet()">Guardar serie</button>
  `;
}

function renderRest(exercise, s, e, allSetsDone) {
  const w = state.active;
  const isPaused = Boolean(w.restPausedRemaining);
  const sec = isPaused
    ? Math.ceil(w.restPausedRemaining / 1000)
    : Math.max(0, Math.ceil((w.restDeadline - Date.now()) / 1000));
  const nextLabel = exercise?.type === 'time'
    ? `${s?.seconds || 40} s`
    : exercise?.type === 'reps'
      ? `${s?.reps || 10} reps`
      : `${s?.weight || 15} kg × ${s?.reps || 10}`;

  return `
    <section id="rest-card" class="rest">
      <div class="next-banner">
        ${allSetsDone
          ? '🎉 Última serie completada · Listo para finalizar tras el descanso'
          : `Siguiente: Serie ${e.activeSetIndex + 1} · ${esc(exercise?.name || '')} (${nextLabel})`}
      </div>
      <div class="eyebrow">${isPaused ? '⏸ Descanso en pausa' : 'Descanso automático'}</div>
      <div id="rest-digits" class="digits">${fmt(sec)}</div>
      <div class="bar"><div id="rest-fill" style="width:${Math.min(100, (sec / (w.restTotal || 90)) * 100)}%"></div></div>
      <div class="row" style="margin-top:10px">
        <button class="btn soft" onclick="togglePauseRest()">${isPaused ? '▶️ Reanudar' : '⏸ Pausar'}</button>
        <button class="btn" onclick="addRest(30)">+30 s</button>
        <button class="btn primary" onclick="skipRest()">Ya estoy</button>
      </div>
    </section>
  `;
}

function swapActiveExercise() {
  const w = state.active;
  const e = activeEntry();
  if (!w || !e) return;
  const currentEx = ex(e.exerciseId);
  const alts = (currentEx?.alternatives || []).map(id => ex(id)).filter(Boolean);
  modal(`
    <div class="row">
      <strong>¿Máquina ocupada ahora?</strong>
      <button class="btn small" onclick="closeModal()">Cerrar</button>
    </div>
    <p class="muted">Cambia <b>${esc(currentEx?.name)}</b> por su alternativa equivalente:</p>
    <div class="stack">
      ${alts.map(a => `
        <button class="btn block" style="text-align:left" onclick="applyActiveSwap('${esc(a.id)}')">
          <div><b>🔄 ${esc(a.name)}</b></div>
          <div class="tiny">${esc(a.station)} · Descanso ${fmt(a.restSec)}</div>
        </button>
      `).join('') || '<p class="muted">Sin alternativas directas.</p>'}
    </div>
  `);
}

function applyActiveSwap(newId) {
  const w = state.active, e = activeEntry();
  if (!w || !e) return;
  const prev = lastSet(newId);
  const doneSets = e.sets.filter(s => s.done);
  const pending = e.sets.filter(s => !s.done);
  if (!pending.length) {
    toast('Este bloque ya está completo');
    return;
  }
  if (doneSets.length) {
    // lo ya hecho se queda en la máquina original; lo pendiente pasa a la alternativa
    e.sets = doneSets;
    e.activeSetIndex = doneSets.length - 1;
    w.entries.splice(w.currentIndex + 1, 0, {
      exerciseId: newId,
      activeSetIndex: 0,
      sets: pending.map(() => ({
        weight: prev ? (Number(prev.weight) || 0) : (ex(newId)?.defaultWeight ?? 15),
        reps: prev?.reps || 10,
        seconds: prev?.seconds || 40,
        done: false,
        partial: false
      }))
    });
    w.currentIndex++;
  } else {
    e.exerciseId = newId;
    const defW = prev ? (Number(prev.weight) || 0) : (ex(newId)?.defaultWeight ?? 15);
    e.sets.forEach(s => {
      s.weight = defW;
      s.reps = prev?.reps || 10;
    });
  }
  save();
  closeModal();
  render();
  toast('Máquina sustituida');
}

function removeBlock() {
  const w = state.active, e = activeEntry();
  if (!w || !e) return;
  const done = e.sets.filter(s => s.done).length;
  if (done && !confirm(`Este bloque tiene ${done} serie(s) hecha(s). ¿Quitarlo y perderlas?`)) return;
  w.entries.splice(w.currentIndex, 1);
  w.currentIndex = Math.max(0, w.currentIndex - 1);
  save();
  closeModal();
  render();
}

function exerciseOptions() {
  const e = activeEntry(), x = ex(e.exerciseId);
  modal(`
    <div class="row"><strong>${esc(x.name)}</strong><button class="btn small" onclick="closeModal()">Cerrar</button></div>
    <button class="btn block" onclick="openStationPicker()">＋ Añadir otra máquina</button>
    <button class="btn block" onclick="removeBlock()">Quitar bloque de esta sesión</button>
    <button class="btn danger block" onclick="discard()">Descartar entreno</button>
  `);
}

// --- SELECTOR EN 2 PASOS ---
function openStationPicker() {
  modal(`
    <div class="row">
      <strong>Añadir · Elige estación o grupo</strong>
      <button class="btn small" onclick="closeModal()">Cerrar</button>
    </div>
    <div class="eyebrow">Por estación del gimnasio</div>
    <div class="stack">
      ${STATIONS.map(st => `
        <button class="btn block row" onclick="openExercisePicker('station', '${esc(st.id)}')">
          <span>${st.emoji} ${esc(st.label)}</span>
          <span class="tiny">${state.exercises.filter(x => x.station === st.id).length} →</span>
        </button>
      `).join('')}
    </div>
    <div class="eyebrow" style="margin-top:6px">Por grupo muscular</div>
    <div class="chips">
      ${MUSCLES.map(m => `<button class="chip" onclick="openExercisePicker('muscle', '${esc(m)}')">${esc(m)}</button>`).join('')}
    </div>
  `);
}

function openExercisePicker(by, val) {
  const list = state.exercises.filter(x => by === 'station' ? x.station === val : x.muscle === val);
  const items = [], seen = new Set();
  for (const x of list) {
    if (x.group) {
      if (seen.has(x.group)) continue;
      seen.add(x.group);
      const variants = list.filter(v => v.group === x.group);
      if (variants.length > 1) {
        items.push({ isGroup: true, name: x.group, variants });
        continue;
      }
    }
    items.push({ isGroup: false, ex: x });
  }
  modal(`
    <div class="row">
      <strong>${esc(val)}</strong>
      <button class="btn small" onclick="openStationPicker()">← Atrás</button>
    </div>
    <div class="stack">
      ${items.map(it => it.isGroup ? `
        <button class="btn block row" style="text-align:left" onclick="openVariantPicker('${esc(by)}', '${esc(val)}', '${esc(it.name)}')">
          <div>
            <div><b>${esc(it.name)}</b> <span class="badge">${it.variants.length} agarres</span></div>
            <div class="tiny">${it.variants.map(v => esc(v.name)).join(' · ')}</div>
          </div>
          <span>→</span>
        </button>
      ` : `
        <button class="btn block row" style="text-align:left" onclick="appendExercise('${esc(it.ex.id)}')">
          <div>
            <div><b>${esc(it.ex.name)}</b></div>
            <div class="tiny">${esc(it.ex.muscle)} · Descanso ${fmt(it.ex.restSec)}</div>
          </div>
          <span>＋</span>
        </button>
      `).join('') || '<p class="muted">No hay máquinas en esta categoría.</p>'}
    </div>
  `);
}

function openVariantPicker(by, val, groupName) {
  const variants = state.exercises.filter(x => (by === 'station' ? x.station === val : x.muscle === val) && x.group === groupName);
  modal(`
    <div class="row">
      <strong>${esc(groupName)} · Elige variante</strong>
      <button class="btn small" onclick="openExercisePicker('${esc(by)}', '${esc(val)}')">← Atrás</button>
    </div>
    <div class="stack">
      ${variants.map(x => {
        const p = lastSet(x.id);
        return `
          <button class="btn block row" style="text-align:left" onclick="appendExercise('${esc(x.id)}')">
            <div>
              <div><b>${esc(x.name)}</b></div>
              <div class="tiny">${p ? (p.weight ? `${p.weight} kg × ${p.reps}` : `${p.reps} reps (0 kg)`) : 'Sin marca previa'} · Desc. ${fmt(x.restSec)}</div>
            </div>
            <span>＋</span>
          </button>
        `;
      }).join('')}
    </div>
  `);
}

function appendExercise(id) {
  const p = lastSet(id);
  const defW = p ? (Number(p.weight) || 0) : (ex(id)?.defaultWeight ?? 15);
  state.active.entries.push({
    exerciseId: id,
    activeSetIndex: 0,
    sets: Array.from({ length: 3 }, () => ({
      weight: defW,
      reps: p?.reps || 10,
      seconds: p?.seconds || 40,
      done: false,
      partial: false
    }))
  });
  state.active.currentIndex = state.active.entries.length - 1;
  state.active.restFinished = false;
  save();
  closeModal();
  render();
}

// --- CALENDARIO ---
function renderCalendar() {
  const [y, m] = state.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7;
  const count = new Date(y, m, 0).getDate();
  const dates = [];

  for (let i = 0; i < offset; i++) dates.push('<div class="day empty"></div>');
  for (let d = 1; d <= count; d++) {
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const has = state.history.some(h => h.date === iso);
    const plan = state.plans[iso];
    dates.push(`
      <button class="day ${iso === today() ? 'today' : ''} ${iso === state.selectedDay ? 'selected' : ''}" onclick="state.selectedDay='${iso}';render()">
        ${d}
        ${has || plan ? `<span class="dot" style="background:${has ? 'var(--lime)' : 'var(--purple)'}"></span>` : ''}
      </button>
    `);
  }

  const sel = state.selectedDay;
  const plan = state.plans[sel];
  const done = state.history.filter(h => h.date === sel);
  const dateText = new Date(sel + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  return `
    <div>
      <div class="eyebrow">Historial y planificación</div>
      <h1 class="title">Calendario</h1>
    </div>
    <section class="card stack">
      <div class="row">
        <button class="btn small" onclick="shiftMonth(-1)">←</button>
        <strong style="text-transform:capitalize">${first.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}</strong>
        <button class="btn small" onclick="shiftMonth(1)">→</button>
      </div>
      <div class="calendar">
        ${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<div class="cal-label">${x}</div>`).join('')}
        ${dates.join('')}
      </div>
      <div class="tiny">🟢 Entreno completado · 🟣 Planificado</div>
    </section>

    <section class="card stack">
      <div class="eyebrow">${sel === today() ? 'Hoy' : 'Día seleccionado'}</div>
      <h2 class="title" style="font-size:17px;text-transform:capitalize">${esc(dateText)}</h2>
      ${done.map(s => `
        <div class="list-item">
          <div class="row"><b>${esc(s.title)}</b><span class="tiny">${s.durationMin} min</span></div>
          <div class="muted">${esc(s.club)} · ${s.entries.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0)} series</div>
        </div>
      `).join('') || '<p class="muted">Sin sesión registrada este día.</p>'}
      <label class="tiny">Planificar rutina</label>
      <select id="plan-routine" class="field">
        <option value="">Sin plan</option>
        ${ROUTINES.map(r => `<option value="${r.id}" ${plan?.routineId === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
      </select>
      <label class="tiny">Club</label>
      <select id="plan-club" class="field">
        ${['Basic-Fit Pl. Universitat', 'Basic-Fit Josep Tarradellas', 'En Casa'].map(c => `<option ${plan?.club === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select>
      <button class="btn primary block" onclick="savePlan('${sel}')">Guardar plan</button>
      ${plan ? `<button class="btn soft block" data-rt="${plan.routineId}" data-club="${esc(plan.club)}" data-date="${sel}" onclick="openRoutineMap(this.dataset.rt, this.dataset.club, this.dataset.date)">Abrir mapa de sesión</button>` : ''}
    </section>
  `;
}

function shiftMonth(n) {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  state.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  render();
}

function savePlan(day) {
  const id = document.getElementById('plan-routine').value;
  const club = document.getElementById('plan-club').value;
  if (id) state.plans[day] = { routineId: id, club };
  else delete state.plans[day];
  save();
  render();
  toast(id ? 'Plan guardado' : 'Plan eliminado');
}

// --- CATÁLOGO DE MÁQUINAS ---
function renderExercises() {
  const q = (state.query || '').trim();
  const inSection = Boolean(state.stationView);
  const currentSt = STATIONS.find(s => s.id === state.stationView);

  if (inSection && !q) {
    return `
      <div class="row">
        <div>
          <div class="eyebrow">Sección</div>
          <h1 class="title">${currentSt?.emoji || '🏋️'} ${esc(currentSt?.label || state.stationView)}</h1>
        </div>
        <button class="btn small" onclick="state.stationView=null;state.filter='Todos';render()">← Secciones</button>
      </div>
      <div class="chips">
        ${['Todos', ...MUSCLES].map(m => `
          <button class="chip ${(!state.filter || state.filter === 'Todos') && m === 'Todos' || state.filter === m ? 'active' : ''}" onclick="state.filter='${m}';render()">${m}</button>
        `).join('')}
      </div>
      <div id="exercise-list" class="stack">${exerciseCards()}</div>
      <button class="btn primary block" onclick="newExercise('${esc(state.stationView)}')">＋ Añadir máquina en esta sección</button>
    `;
  }

  return `
    <div class="row">
      <div>
        <div class="eyebrow">Catálogo</div>
        <h1 class="title">Máquinas y Estaciones</h1>
      </div>
      <button class="btn soft small" onclick="newExercise()">＋ Nueva</button>
    </div>
    <input id="search" class="field" placeholder="Buscar máquina, polea o grupo…" value="${esc(state.query || '')}" oninput="filterExercises()">
    <div id="exercise-list" class="stack">
      ${q ? exerciseCards() : STATIONS.map(st => {
        const count = state.exercises.filter(x => x.station === st.id).length;
        return `
          <button class="card row" style="text-align:left;width:100%" onclick="state.stationView='${esc(st.id)}';state.filter='Todos';render()">
            <div class="row" style="gap:12px">
              <span style="font-size:26px">${st.emoji}</span>
              <div>
                <strong style="font-size:16px">${esc(st.label)}</strong>
                <div class="tiny">${count} ${count === 1 ? 'ejercicio' : 'ejercicios'}</div>
              </div>
            </div>
            <span class="badge">Abrir →</span>
          </button>
        `;
      }).join('')}
    </div>
    <button class="btn soft block" onclick="newExercise()">＋ Añadir máquina no guardada</button>
  `;
}

function exerciseCards() {
  const q = (state.query || '').toLowerCase().trim();
  const arr = state.exercises.filter(x =>
    (!state.stationView || q || x.station === state.stationView) &&
    (!state.filter || state.filter === 'Todos' || x.muscle === state.filter) &&
    (!q || `${x.name} ${x.station} ${x.muscle} ${x.note || ''}`.toLowerCase().includes(q))
  );
  return arr.map(x => {
    const p = lastSet(x.id);
    const st = STATIONS.find(s => s.id === x.station);
    return `
      <button class="list-item" style="text-align:left;color:inherit" onclick="editExercise('${esc(x.id)}')">
        <div class="row">
          <b>${st?.emoji || '🏋️'} ${esc(x.name)}</b>
          <span class="badge">${p ? (p.weight ? `${p.weight} kg` : p.seconds ? `${p.seconds} s` : `${p.reps} reps`) : 'Sin marca'}</span>
        </div>
        <div class="muted" style="margin-top:3px">${esc(x.muscle)} · Desc. ${fmt(x.restSec || 90)}</div>
        ${x.note ? `<div class="tiny" style="color:var(--purple);margin-top:3px">📝 ${esc(x.note)}</div>` : ''}
      </button>
    `;
  }).join('') || '<p class="muted">No hay máquinas en esta categoría.</p>';
}

function filterExercises() {
  state.query = document.getElementById('search').value;
  const list = document.getElementById('exercise-list');
  if (list) list.innerHTML = exerciseCards();
}

function editExercise(id) {
  const x = ex(id);
  modal(`
    <div class="row"><strong>${esc(x.name)}</strong><button class="btn small" onclick="closeModal()">Cerrar</button></div>
    <label class="tiny">Descanso por defecto (segundos)</label>
    <input id="ex-rest" type="number" inputmode="numeric" class="field" value="${x.restSec || 90}">
    <label class="tiny">Tu ajuste personal (asiento, polea, agarre)</label>
    <input id="note" class="field" value="${esc(x.note || '')}" placeholder="Ej. Asiento en el 4, polea abajo">
    <button class="btn primary block" onclick="
      const target = ex('${esc(id)}');
      target.restSec = Math.max(15, Number(document.getElementById('ex-rest').value) || 90);
      target.note = document.getElementById('note').value.trim();
      save(); closeModal(); render(); toast('Ajustes guardados');
    ">Guardar cambios</button>
  `);
}

function newExercise(defaultStation = null) {
  modal(`
    <div class="row"><strong>Nueva máquina o ejercicio</strong><button class="btn small" onclick="closeModal()">Cerrar</button></div>
    <input id="new-name" class="field" placeholder="Nombre de la máquina">
    <label class="tiny">Estación</label>
    <select id="new-station" class="field">
      ${STATIONS.map(s => `<option value="${esc(s.id)}" ${defaultStation === s.id ? 'selected' : ''}>${s.emoji} ${esc(s.label)}</option>`).join('')}
    </select>
    <label class="tiny">Grupo muscular</label>
    <select id="new-muscle" class="field">
      ${MUSCLES.map(m => `<option>${m}</option>`).join('')}
    </select>
    <label class="tiny">Medición</label>
    <select id="new-type" class="field">
      <option value="weight">Peso (kg) + repeticiones</option>
      <option value="reps">Solo repeticiones</option>
      <option value="time">Por tiempo (segundos)</option>
    </select>
    <label class="tiny">Descanso (segundos)</label>
    <input id="new-rest" type="number" inputmode="numeric" class="field" value="90">
    <button class="btn primary block" onclick="
      const n = document.getElementById('new-name').value.trim();
      if (!n) { toast('Escribe un nombre'); return; }
      const st = document.getElementById('new-station').value;
      state.exercises.push({
        id: 'custom_' + Date.now(),
        name: n,
        station: st,
        zone: st,
        muscle: document.getElementById('new-muscle').value,
        type: document.getElementById('new-type').value,
        restSec: Math.max(15, Number(document.getElementById('new-rest').value) || 90),
        priority: 'mantenimiento',
        alternatives: [],
        guide: { setup: 'Ajusta el asiento a tu altura.', execution: 'Movimiento controlado.', breathing: 'Exhala al hacer fuerza.' }
      });
      save(); closeModal(); render(); toast('Máquina creada');
    ">Crear máquina</button>
  `);
}

// --- PROGRESO ---
function weekStart(date) {
  const d = new Date(date + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return localDate(d);
}

function weekly() {
  const monday = weekStart(today()), counts = {};
  for (const s of state.history) {
    const k = weekStart(s.date);
    counts[k] = (counts[k] || 0) + 1;
  }
  let streak = 0, d = new Date(monday + 'T12:00:00');
  if ((counts[monday] || 0) < state.goal) d.setDate(d.getDate() - 7);
  while ((counts[localDate(d)] || 0) >= state.goal) {
    streak++;
    d.setDate(d.getDate() - 7);
  }
  return { count: counts[monday] || 0, streak };
}

let lastUpdateCheck = 0;
function checkForUpdate() {
  if (!window._swReg || Date.now() - lastUpdateCheck < 15 * 60 * 1000) return;
  lastUpdateCheck = Date.now();
  window._swReg.update().catch(() => {});
}

function showUpdateBanner() {
  if (document.getElementById('update-banner')) return;
  const el = document.createElement('div');
  el.id = 'update-banner';
  el.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;max-width:496px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#241b35;color:#fff;box-shadow:0 8px 24px rgba(36,27,53,.3);font-size:13px');
  el.innerHTML = `<span>✨ Nueva versión lista${state.active ? ' · tu entreno se conserva' : ''}</span><button class="btn small primary" onclick="location.reload()">Actualizar</button>`;
  document.querySelector('.app').appendChild(el);
}

const BACKUP_KEY = 'ttt_last_backup';
function markBackup() { try { localStorage.setItem(BACKUP_KEY, String(Date.now())); } catch {} }
function backupAgeDays() {
  try {
    const t = Number(localStorage.getItem(BACKUP_KEY));
    return t ? Math.floor((Date.now() - t) / 86400000) : null;
  } catch { return null; }
}
function backupNudge() {
  if (state.history.length < 3) return '';
  const d = backupAgeDays();
  if (d !== null && d < 14) return '';
  return `<div class="card stack" style="background:var(--panel2)">
    <b>💾 ${d === null ? 'Aún no has hecho ningún backup' : `Hace ${d} días del último backup`}</b>
    <p class="tiny" style="margin:0">Tus ${state.history.length} sesiones viven solo en este iPhone.</p>
    <button class="btn primary block" onclick="exportJSON()">Guardar backup ahora</button>
  </div>`;
}

function e1rm(w, r) { return r <= 1 ? w : w * (1 + r / 30); }

function sparkline(pts, w = 84, h = 26) {
  if (pts.length < 2) return '';
  const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1, pad = 3;
  const xy = pts.map((v, i) => [pad + (i * (w - pad * 2)) / (pts.length - 1), h - pad - ((v - lo) / span) * (h - pad * 2)]);
  const last = xy[xy.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">`
    + `<polyline fill="none" style="stroke:var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`
    + `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.8" style="fill:var(--purple)"/></svg>`;
}

function strengthTrends() {
  const byEx = {};
  for (const h of state.history.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    for (const en of h.entries) {
      if (ex(en.exerciseId)?.type !== 'weight') continue;
      const best = Math.max(0, ...en.sets.filter(s => s.done && s.weight > 0 && s.reps > 0 && s.reps <= 15).map(s => e1rm(s.weight, s.reps)));
      if (best > 0) (byEx[en.exerciseId] = byEx[en.exerciseId] || []).push(best);
    }
  }
  return Object.entries(byEx).filter(([, v]) => v.length >= 2).map(([id, v]) => {
    const pts = v.slice(-8);
    return { id, n: v.length, name: ex(id).name, pts, last: pts[pts.length - 1], delta: pts[pts.length - 1] - pts[0] };
  }).sort((a, b) => b.n - a.n).slice(0, 6);
}

function renderStrength() {
  const rows = strengthTrends();
  if (!rows.length) {
    return '<div class="card stack"><b>Fuerza · 1RM estimado</b><p class="tiny">Haz el mismo ejercicio en 2 sesiones y aquí aparece su tendencia.</p></div>';
  }
  return `<div class="card stack"><div class="row"><b>Fuerza · 1RM estimado</b><span class="tiny">últimas sesiones</span></div>${rows.map(r => `
    <div class="row">
      <div style="min-width:0">
        <div style="font-weight:700;font-size:13px">${esc(r.name)}</div>
        <div class="tiny">${Math.round(r.last * 10) / 10} kg · <span style="color:${r.delta >= 0 ? 'var(--mint)' : 'var(--red)'};font-weight:700">${r.delta >= 0 ? '+' : '−'}${Math.abs(Math.round(r.delta * 10) / 10)} kg</span></div>
      </div>
      ${sparkline(r.pts)}
    </div>`).join('')}</div>`;
}

function renderWeekSets() {
  const monday = weekStart(today());
  const sets = Object.fromEntries(MUSCLES.map(m => [m, 0]));
  for (const h of state.history) {
    if (weekStart(h.date) !== monday) continue;
    for (const en of h.entries) {
      const x = ex(en.exerciseId);
      if (x && sets[x.muscle] !== undefined) sets[x.muscle] += en.sets.filter(s => s.done).length;
    }
  }
  const CAP = 24;
  return `<div class="card stack"><div class="row"><b>Esta semana</b><span class="tiny">franja: 10–20 series</span></div>${MUSCLES.map(m => {
    const n = sets[m];
    return `<div>
      <div class="row"><span class="muted">${m}</span><span class="tiny">${n}</span></div>
      <div class="progress" style="position:relative"><div style="width:${Math.min(100, (n / CAP) * 100)}%;background:${n >= 10 ? 'var(--mint)' : 'var(--purple)'}"></div><i style="position:absolute;top:0;bottom:0;left:${(10 / CAP) * 100}%;width:${(10 / CAP) * 100}%;border-left:2px solid var(--line);border-right:2px solid var(--line);pointer-events:none"></i></div>
    </div>`;
  }).join('')}</div>`;
}

function renderProgress() {
  const w = weekly();
  const setsBy = Object.fromEntries(MUSCLES.map(m => [m, 0]));
  let volume = 0;

  for (const h of state.history) {
    for (const e of h.entries) {
      const x = ex(e.exerciseId);
      for (const s of e.sets) {
        if (s.done) {
          if (x && setsBy[x.muscle] !== undefined) setsBy[x.muscle]++;
          if (x?.type === 'weight') volume += (s.weight || 0) * (s.reps || 0);
        }
      }
    }
  }
  const max = Math.max(1, ...Object.values(setsBy));

  return `
    <div>
      <div class="eyebrow">Progreso</div>
      <h1 class="title">Tus números, sin drama</h1>
    </div>
    ${backupNudge()}
    <div class="kpis">
      <div class="kpi"><span>Esta semana</span><strong>${w.count}/${state.goal}</strong></div>
      <div class="kpi"><span>Racha meta</span><strong>${w.streak} sem</strong></div>
      <div class="kpi"><span>Sesiones</span><strong>${state.history.length}</strong></div>
    </div>
    ${renderWeekSets()}
    ${renderStrength()}
    <div class="card stack">
      <div class="row"><b>Series por grupo · total</b><span class="tiny">${Math.round(volume)} kg movidos</span></div>
      ${MUSCLES.map(m => `
        <div>
          <div class="row"><span class="muted">${m}</span><span class="tiny">${setsBy[m]}</span></div>
          <div class="progress"><div style="width:${(setsBy[m] / max) * 100}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="card stack">
      <b>Objetivo semanal</b>
      <div class="chips">
        ${[2, 3, 4, 5, 6].map(n => `<button class="chip ${state.goal === n ? 'active' : ''}" onclick="state.goal=${n};save();render()">${n} días</button>`).join('')}
      </div>
    </div>
    <div class="card stack">
      <b>Sonido de aviso</b>
      <p class="tiny">Avisa al terminar el descanso si tienes la app abierta.</p>
      <button class="btn ${state.sound ? 'soft' : ''}" onclick="state.sound=!state.sound;save();if(state.sound){unlockAudio();beep()}render()">
        ${state.sound ? '🔔 Sonido activado' : '🔕 Activar sonido'}
      </button>
    </div>
    <div class="card stack">
      <b>Copia de seguridad</b>
      <div class="row">
        <button class="btn" onclick="exportJSON()">Backup JSON</button>
        <button class="btn" onclick="exportCSV()">Exportar CSV</button>
      </div>
      <label class="btn soft block" style="text-align:center">
        Restaurar JSON <input type="file" accept=".json,application/json" class="hidden" onchange="if(this.files[0]){importBackup(this.files[0]);this.value=''}">
      </label>
      <button class="btn danger block" onclick="clearHistory()">Vaciar historial…</button>
    </div>
  `;
}

function clearHistory() {
  modal(`
    <b>¿Vaciar el historial?</b>
    <p class="muted">Se conservan tus máquinas y ajustes. Haz un backup antes si quieres conservar tus datos.</p>
    <button class="btn" onclick="exportJSON()">Descargar backup JSON</button>
    <div class="row">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn danger" onclick="state.history=[];save();closeModal();render();toast('Historial vaciado')">Vaciar</button>
    </div>
  `);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({
    version: 7,
    exportedAt: new Date().toISOString(),
    exercises: state.exercises,
    history: state.history,
    plans: state.plans,
    goal: state.goal
  }, null, 2)], { type: 'application/json' });
  download(blob, `twinktwank-backup-${today()}.json`).then(ok => { if (ok) markBackup(); });
}

function exportCSV() {
  const rows = [['Fecha', 'Rutina', 'Club', 'Duración min', 'Máquina', 'Estación', 'Grupo', 'Peso kg', 'Reps', 'Tiempo s', 'Estado'].map(csv).join(',')];
  for (const h of state.history) {
    for (const e of h.entries) {
      for (const s of e.sets) {
        const x = ex(e.exerciseId);
        rows.push([
          h.date, h.title, h.club, h.durationMin,
          x?.name || e.exerciseId, x?.station || '', x?.muscle || '',
          s.weight, s.reps, s.seconds,
          s.partial ? 'Parcial' : s.done ? 'Completada' : 'Pendiente'
        ].map(csv).join(','));
      }
    }
  }
  download(new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }), `twinktwank-${today()}.csv`);
}

function csv(v) {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r\n]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

async function download(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type.split(';')[0] });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return true;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return false;
  }
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
  return true;
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.history)) throw 0;
      const incoming = migrateHistory(d.history);
      const have = new Set(state.history.map(h => h.id));
      state.history = [...state.history, ...incoming.filter(h => !have.has(h.id))]
        .sort((a, b) => a.date.localeCompare(b.date));
      if (Array.isArray(d.exercises)) state.exercises = mergeExercises(d.exercises);
      if (d.plans && typeof d.plans === 'object') state.plans = d.plans;
      if ([2, 3, 4, 5, 6].includes(Number(d.goal))) state.goal = Number(d.goal);
      save();
      closeModal();
      render();
      toast('Copia restaurada');
    } catch {
      toast('Archivo de copia no válido');
    }
  };
  r.readAsText(file);
}

function render() {
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  document.getElementById('status').textContent = state.active
    ? 'Sesión en curso'
    : new Date().toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
  const root = document.getElementById('view');
  root.innerHTML = state.tab === 'entrenar'
    ? renderTrain()
    : state.tab === 'calendario'
      ? renderCalendar()
      : state.tab === 'ejercicios'
        ? renderExercises()
        : renderProgress();

   if (state.active) {
    startLoop();
    if (state.active.restDeadline) updateRest();
  } else {
    clearInterval(interval);
  }
  setWakeLock(Boolean(state.active && state.active.restDeadline));
}

function init() {
  window.addEventListener('popstate', onPopState);
  try { navigator.storage?.persist?.(); } catch {}
  load(); if (state.active && !state.active.stale && state.active.restDeadline && state.active.restDeadline < Date.now()) {
    state.active.restFinished = true;
    state.active.restDeadline = null;
  }
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      window._swReg = reg;
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
        });
      });
    }).catch(e => console.error('SW error', e));
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForUpdate();
    if (!document.hidden && state.active) {
      if (state.active.restDeadline) updateRest();
      render();
    }
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
