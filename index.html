<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="3T Gym">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>TwinkTwankTwunk · Gym</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f6ff;
      --panel: #ffffff;
      --panel2: #eee8ff;
      --line: #d9cdef;
      --text: #241b35;
      --muted: #625a73;
      --purple: #6d28d9;
      --purple-soft: #ede9fe;
      --lime: #4d7c0f;
      --lime-bg: #ecfccb;
      --mint: #059669;
      --red: #e11d48;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { min-height: 100vh; min-height: 100dvh; }
    button, input, select { font: inherit; }
    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: .4; cursor: default; }
    html, body { overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
    button, .chip, .day { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .set-row.pr { animation: prflash 1.4s ease-out; }
    @keyframes prflash { 0% { background: #fde68a; transform: scale(1.02); } 100% { background: var(--bg); transform: none; } }
    .app {
      max-width: 520px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      position: relative;
      background: var(--bg);
      padding-bottom: calc(82px + var(--safe-b));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: calc(10px + var(--safe-t)) 18px 12px;
      background: rgba(248, 246, 255, 0.92);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .brand { font-size: 16px; font-weight: 900; letter-spacing: -.4px; color: var(--text); }
    .brand b { color: var(--purple); }
    .status {
      font-size: 11px;
      font-weight: 750;
      color: var(--purple);
      background: var(--panel2);
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 99px;
    }
    .view { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--purple);
      font-weight: 800;
      font-size: 10px;
    }
    .title { font-size: 22px; letter-spacing: -.5px; font-weight: 900; margin: 2px 0 0; color: var(--text); }
    .subtitle { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(109, 40, 217, 0.04);
    }
    .card.focus {
      border-color: #b794f4;
      box-shadow: 0 10px 28px rgba(109, 40, 217, 0.09);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--muted); font-size: 12px; }
    .tiny { color: var(--muted); font-size: 11px; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--panel2);
      color: var(--purple);
    }
    .badge.prio { background: var(--lime-bg); color: var(--lime); }
    .badge.opt { background: #f3f4f6; color: var(--muted); }
    .btn {
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel2);
      color: var(--text);
      padding: 11px 13px;
      font-size: 13px;
      font-weight: 750;
      transition: transform .08s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #ffffff;
      border: 0;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.22);
    }
    .btn.soft {
      color: var(--purple);
      background: var(--panel2);
      border-color: #c4b5fd;
    }
    .btn.danger {
      color: var(--red);
      background: #fff1f2;
      border-color: #fecdd3;
    }
    .btn.block { width: 100%; }
    .btn.small { padding: 7px 10px; font-size: 12px; border-radius: 10px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; flex-wrap: wrap; }
    .chip {
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      background: var(--panel);
    }
    .chip.active {
      background: var(--purple);
      color: #ffffff;
      border-color: var(--purple);
    }
    .nav {
      position: fixed;
      z-index: 6;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      padding: 8px 10px calc(8px + var(--safe-b));
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .nav button {
      border: 0;
      background: none;
      color: var(--muted);
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
      font-size: 10px;
      font-weight: 750;

    .nav button.active { color: var(--purple); }
    .nav i { font-style: normal; font-size: 18px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

      background: var(--panel);

    .kpi span { color: var(--muted); font-size: 10px; font-weight: 600; }
    .exercise-name { font-size: 19px; font-weight: 900; line-height: 1.25; color: var(--text); }
    .step-grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 9px; }
    .step {
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 15px;
    }
    .step label { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin: 0 0 6px 2px; }
    .weight-input {
      width: 100%;
      background: var(--panel);
      border: 1.5px solid #c4b5fd;
      border-radius: 11px;
      padding: 8px 6px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      color: var(--purple);
      font-variant-numeric: tabular-nums;
    }
    .weight-input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.15); }
    .rest {
      padding: 18px;
      background: var(--panel2);
      border: 1.5px solid #c4b5fd;
      border-radius: 18px;
      text-align: center;
    }
    .digits {
      font-size: 46px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1.5px;
      color: var(--purple);
      margin: 4px 0;
    }
    .bar { height: 7px; border-radius: 9px; background: #ffffff; margin: 12px 0 6px; overflow: hidden; border: 1px solid var(--line); }
    .bar div { height: 100%; background: linear-gradient(90deg, #8b5cf6, #6d28d9); width: 100%; transition: width .2s linear; }
    .set-list { display: flex; flex-direction: column; gap: 6px; }
    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--line);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .set-row.done { border-color: #6ee7b7; background: #ecfdf5; color: var(--mint); }
    .set-row.active-row { border-color: var(--purple); background: var(--panel2); font-weight: 800; }
    .field {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      color: var(--text);
      width: 100%;
      font-size: 16px;
    }
    .field:focus { outline: none; border-color: var(--purple); }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .day {
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 12px;
      font-weight: 700;
    }
    .day.today { border-color: var(--purple); color: var(--purple); font-weight: 900; }
    .day.selected { background: var(--purple); color: #ffffff; border-color: var(--purple); }
    .day .dot { position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 9px; }
    .day.empty { background: transparent; border-color: transparent; }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(36, 27, 53, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px 12px calc(12px + var(--safe-b));
    }
    .sheet {
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(36, 27, 53, 0.2);
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      z-index: 30;
      top: calc(60px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 10px 16px;
      background: var(--text);
      color: #ffffff;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 750;
      box-shadow: 0 8px 24px rgba(36, 27, 53, 0.25);
    }
    .progress { height: 8px; background: var(--panel2); border-radius: 8px; overflow: hidden; }
    .progress div { height: 100%; background: var(--purple); border-radius: 8px; }
    .list-item { padding: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; }
    .cal-label { font-size: 10px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
    details.guide-box {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
    }
    details.guide-box summary {
      font-weight: 800;
      color: var(--purple);
      cursor: pointer;
      list-style: none;
    }
    details.guide-box summary::-webkit-details-marker { display: none; }
    details.guide-box p { margin: 8px 0 0; line-height: 1.45; color: var(--text); }
    .draft-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 11px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .draft-row.excluded { opacity: .48; }
    .next-banner {

      border-radius: 11px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);

      padding: 10px 12px;

      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

function today() { return localDate(new Date()); }
function localDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function monthKey(s) { return s.slice(0, 7); }
function esc(s) {

function normalizeSet(s) {
  return {
    weight: Math.max(0, Number(s?.weight) || 0),
    reps: Math.max(0, Number(s?.reps) || 0),
    seconds: Math.max(0, Number(s?.seconds ?? s?.time) || 0),
    done: s?.done === true,
    partial: s?.partial === true
  };
}

function makeId() { return 'wk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

function migrateHistory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.flatMap(s => {
    if (!s || typeof s !== 'object') return [];
    const parsedDate = new Date(s.date);
    const d = /^\d{4}-\d{2}-\d{2}$/.test(String(s.date || ''))
      ? String(s.date)
      : (!Number.isNaN(parsedDate.getTime()) ? localDate(parsedDate) : '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !Array.isArray(s.entries)) return [];
    const entries = s.entries.flatMap(e => {
      if (!e || typeof e.exerciseId !== 'string' || !Array.isArray(e.sets)) return [];
      const sets = e.sets.map(x => {
        const out = normalizeSet(x);
        if (typeof x?.done !== 'boolean') out.done = x?.partial !== true;
        return out;
      });
      return sets.length ? [{ exerciseId: e.exerciseId, sets }] : [];
    });
    return entries.length ? [{
      id: String(s.id || makeId()),
      date: d,
      title: String(s.title || s.routineTitle || 'Entreno'),
      club: String(s.club || s.location || ''),
      durationMin: Math.max(1, Math.min(240, Number(s.durationMin) || 1)),
      entries
    }] : [];
  });
}

function mergeExercises(savedList) {
  const base = clone(EXERCISES);
  if (!Array.isArray(savedList) || !savedList.length) return base;
  const map = new Map(base.map(item => [item.id, item]));
  for (const item of savedList) {
    if (!item || typeof item.id !== 'string') continue;
    const normType = item.type === 'weight_reps' ? 'weight' : (item.type || 'weight');
    if (map.has(item.id)) {
      const def = map.get(item.id);
      map.set(item.id, {
        ...def,
        note: item.note || def.note || '',
        restSec: Number(item.restSec) || def.restSec
      });
    } else {
      map.set(item.id, {
        ...item,
        type: normType,
        station: item.station || item.zone || 'Máquinas',
        zone: item.zone || item.station || 'Máquinas',
        restSec: Number(item.restSec) || 90,
        priority: item.priority || 'mantenimiento',
        alternatives: Array.isArray(item.alternatives) ? item.alternatives : [],
        guide: item.guide || { setup: item.note || 'Ajusta postura cómoda.', execution: 'Movimiento controlado.', breathing: 'Exhala en el esfuerzo.' }
      });
    }
  }
  return Array.from(map.values());
}

function normalizeActive(a) {
  if (!a || typeof a !== 'object' || !Array.isArray(a.entries)) return null;
  const entries = a.entries.flatMap(e => {
    if (!e || typeof e.exerciseId !== 'string' || !Array.isArray(e.sets)) return [];
    return [{
      exerciseId: e.exerciseId,
      sets: e.sets.map(s => {
        let accumulated = Number(s.accumulatedSec) || (s.done ? Number(s.seconds ?? s.time) : 0) || 0;
        const wasRunning = Boolean(s.timerRunning && Number(s.timerStartedAt));
        if (wasRunning) accumulated += Math.max(0, Math.floor((Date.now() - Number(s.timerStartedAt)) / 1000));
        return {
          ...normalizeSet(s),
          pr: s.pr === true,
          timerRunning: wasRunning,
          timerStartedAt: wasRunning ? Date.now() : null,
          accumulatedSec: accumulated
        };
      }),
      activeSetIndex: Math.max(0, Math.min(Number(e.activeSetIndex) || 0, e.sets.length - 1))
    }];
  });
  if (!entries.length) return null;
  return {
    ...a,
    id: String(a.id || makeId()),
    title: String(a.title || a.routineTitle || 'Entreno libre'),
    club: String(a.club || a.location || ''),

}

function load() {
  let raw = null, parsed = null;
  try {
    raw = localStorage.getItem(KEY);
    if (raw) parsed = JSON.parse(raw);
    else {
      for (const k of LEGACY_KEYS) {
        const old = localStorage.getItem(k);
        if (old) {
          try {
            const p = JSON.parse(old);
            if (p && Array.isArray(p.history)) { raw = old; parsed = p; break; }
          } catch {}
        }
      }
    }
  } catch { try { if (raw) localStorage.setItem(KEY + '_corrupt', raw); } catch {} raw = null; }

  const base = DEFAULTS();
  if (!parsed) {
    state = base;
    return;
  }
  state = {
    ...base,
    exercises: mergeExercises(parsed.exercises),
    history: migrateHistory(parsed.history),
    plans: parsed.plans && typeof parsed.plans === 'object' ? parsed.plans : (parsed.plannedDays || {}),
    goal: [2, 3, 4, 5, 6].includes(Number(parsed.goal ?? parsed.settings?.weeklyGoal))
      ? Number(parsed.goal ?? parsed.settings?.weeklyGoal)
      : 3,
    sound: Boolean(parsed.sound ?? parsed.settings?.soundEnabled),
    active: normalizeActive(parsed.active ?? parsed.activeWorkout)
  };
  for (const h of state.history) {
    for (const en of h.entries) {
      const t = ex(en.exerciseId)?.type;
      en.sets.forEach(s => {
        if (t === 'time') { s.weight = 0; s.reps = 0; }
        else if (t === 'reps') { s.weight = 0; s.seconds = 0; }
        else if (t === 'weight') s.seconds = 0;
      });
    }
  }
  if (state.active && state.active.startedAt) {
    const days = (Date.now() - Number(state.active.startedAt)) / 86400000;
    if (days > 2) state.active.stale = true;
  }
  save();
}

function lastSet(id) {
  for (const s of state.history.slice().reverse().sort((a, b) => b.date.localeCompare(a.date))) {
    const e = s.entries.find(e => e.exerciseId === id);
    if (e) {
      const done = e.sets.filter(x => x.done);
      if (!done.length) continue;
      return done[done.length - 1];
    }
  }
  return null;
}

function lastDoneSets(id) {
  for (const s of state.history.slice().reverse().sort((a, b) => b.date.localeCompare(a.date))) {
    const en = s.entries.find(x => x.exerciseId === id);
    const done = en ? en.sets.filter(x => x.done) : [];
    if (done.length) return done;
  }
  return [];
}

function ghostSet(id, i) {
  const arr = lastDoneSets(id);
  return arr.length ? arr[Math.min(i, arr.length - 1)] : null;
}

function ghostText(exercise, g, compact) {
  if (exercise?.type === 'time') return `${g.seconds || 0} s`;
  if (exercise?.type === 'reps') return compact ? `${g.reps || 0}` : `${g.reps || 0} reps`;
  return compact ? `${g.weight || 0}×${g.reps || 0}` : `${g.weight || 0} kg × ${g.reps || 0}`;
}

function setLabel(exercise, x, e, i) {
  const main = exercise?.type === 'time' ? `${x.seconds || 0} s`
    : exercise?.type === 'reps' ? `${x.reps || 0} reps`
    : `${x.weight || 0} kg × ${x.reps || 0}`;
  const g = x.done ? null : ghostSet(e.exerciseId, i);
  return g ? `${main} <span class="tiny">· antes ${ghostText(exercise, g, true)}</span>` : main;
}

function ghostButton(exercise, e, s) {
  if (exercise?.type === 'time') return '';
  const g = ghostSet(e.exerciseId, e.activeSetIndex);
  if (!g) return '';
  const same = exercise?.type === 'weight' ? (g.weight === s.weight && g.reps === s.reps) : g.reps === s.reps;
  if (same) return '';
  return `<button class="btn soft block" onclick="applyGhost()">↺ Como la última vez: ${ghostText(exercise, g)}</button>`;
}

function applyGhost() {
  const e = activeEntry(), s = activeSet();
  if (!e || !s) return;
  const t = ex(e.exerciseId)?.type;
  const g = ghostSet(e.exerciseId, e.activeSetIndex);
  if (!g || t === 'time') return;
  if (t === 'weight') s.weight = g.weight;
  s.reps = g.reps;
  save();

}

function lastSessionSummary(id) {
  const exo = ex(id);
  for (const s of state.history.slice().reverse().sort((a, b) => b.date.localeCompare(a.date))) {
    const e = s.entries.find(e => e.exerciseId === id);
    if (e) {
      const done = e.sets.filter(x => x.done);
      const sets = done;
      if (!sets.length) continue;
      if (exo?.type === 'time') {
        const secs = sets.map(x => `${x.seconds || 0} s`).join(' · ');
        return `Última vez: <b>${secs}</b>`;
      }
      if (exo?.type === 'reps') {
        const reps = sets.map(x => x.reps || 0);
        return `Última vez: <b>${reps.join(', ')} reps</b> → Hoy prueba: <b>${Math.max(...reps) + 1} reps</b>`;
      }
      const repsList = sets.map(x => x.reps || 0);
      const top = Math.max(...sets.map(x => Number(x.weight) || 0));
      if (top === 0) {
        return `Última: <b>${repsList.join(', ')} reps</b> (sin lastre) → Hoy prueba: <b>${Math.max(...repsList) + 1} reps</b>`;
      }
      const topSets = sets.filter(x => (Number(x.weight) || 0) === top);
      const topReps = topSets.map(x => x.reps || 0);
      const repTop = Number(exo?.repTop) || 12;
      const step = Number(exo?.step) || (exo?.zone === 'Mancuernas' ? 2 : 2.5);
      const hitTop = topSets.length >= 2 && topReps.every(r => r >= repTop);
      const shown = topSets.length === sets.length
        ? `${top} kg · ${repsList.join(', ')} reps`
        : sets.map(x => `${Number(x.weight) || 0}×${x.reps || 0}`).join(' · ');
      const nextW = Math.round((top + step) * 10) / 10;
      const suggestion = hitTop
        ? `Hoy prueba: <b>${nextW} kg</b> (reps vuelven a ~${repTop - 3})`
        : `Hoy prueba: <b>${top} kg × ${Math.min(...topReps) + 1}</b>`;
      return `Última: <b>${shown}</b> → ${suggestion}`;
    }
  }
  return 'Primera vez: registra tu referencia inicial';
}

let wakeLock = null, wakeWanted = false, wakePending = false, wakeWarned = false;
async function setWakeLock(active) {
  wakeWanted = active;
  if (!('wakeLock' in navigator)) return;
  if (active) {
    if (wakeLock || wakePending || document.hidden) return;
    wakePending = true;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (!wakeWanted) {
        lock.release().catch(() => {});
      } else {
        wakeLock = lock;
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
      }
    } catch {
      if (!wakeWarned) {
        wakeWarned = true;
        toast('Pantalla activa no disponible ahora (¿iOS < 18.4 o ahorro de batería?)');
      }
    } finally {
      wakePending = false;
    }
  } else if (wakeLock) {
    const lock = wakeLock;
    wakeLock = null;
    try { await lock.release(); } catch {}
  }
}

function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
}

function startLoop() {
  clearInterval(interval);
  if (!state.active) return;
  interval = setInterval(() => {
    if (state.active?.restDeadline) updateRest();
    const el = document.getElementById('plank-live');
    const set = activeSet();
    if (el && set?.timerRunning) {
      el.textContent = `${Math.floor(set.accumulatedSec + (Date.now() - set.timerStartedAt) / 1000)} s`;
    }
  }, 250);
}

function activeEntry() { return state.active?.entries[state.active.currentIndex]; }
function activeSet() {
  const e = activeEntry();
  const s = e?.sets[e.activeSetIndex];
  if (s && !Number.isFinite(s.accumulatedSec)) {
    s.accumulatedSec = 0;
    s.timerRunning = false;
    s.timerStartedAt = null;
  }
  return s;
}
function updateRest() {
  const w = state.active;
  if (!w?.restDeadline) return;
  const left = Math.ceil((w.restDeadline - Date.now()) / 1000);
  if (left <= 0 && !w.restFinished) {
    w.restFinished = true;
    w.restDeadline = null;
    w.restPausedRemaining = null;
    if (state.sound && left > -3) beep();
    save();
    render();
    return;
  }
  const num = document.getElementById('rest-digits');
  const fill = document.getElementById('rest-fill');
  if (num) num.textContent = fmt(left);
  if (fill) fill.style.width = `${Math.max(0, Math.min(100, (left / (w.restTotal || 90)) * 100))}%`;
}
function togglePauseRest() {
  const w = state.active;
  if (!w || (!w.restDeadline && !w.restPausedRemaining)) return;
  if (w.restPausedRemaining) {
    w.restDeadline = Date.now() + w.restPausedRemaining;
    w.restPausedRemaining = null;
    setWakeLock(true);
  } else {
    w.restPausedRemaining = Math.max(1000, w.restDeadline - Date.now());
    w.restDeadline = null;
    setWakeLock(false);
  }
  save();
  render();
}

function addRest(sec) {
  const w = state.active;
  if (!w) return;
  if (w.restPausedRemaining) {
    w.restPausedRemaining = Math.max(1000, w.restPausedRemaining + sec * 1000);
    w.restTotal = Math.max(w.restTotal || 90, Math.ceil(w.restPausedRemaining / 1000));
  } else if (w.restDeadline) {
    w.restDeadline = Math.max(Date.now() + 1000, w.restDeadline + sec * 1000);
    w.restTotal = Math.max(w.restTotal || 90, Math.ceil((w.restDeadline - Date.now()) / 1000));
  }
  save();
  render();
}

function skipRest() {
  if (!state.active) return;
  state.active.restDeadline = null;
  state.active.restPausedRemaining = null;
  state.active.restFinished = true;
  setWakeLock(false);
  save();
  render();
}

function beep() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state !== 'running') audio.resume().catch(() => {});
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 780;
    g.gain.setValueAtTime(.001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.09, audio.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .24);
    o.connect(g);
    g.connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + .26);
  } catch {}
}

// --- EDICIÓN DIRECTA DE PESO, REPS Y SERIES ---
function editSet(field, value) {
  const s = activeSet();
  if (!s) return;
  const num = parseFloat(String(value).replace(',', '.'));
  s[field] = Number.isNaN(num) ? 0 : Math.max(0, Math.round(num * 10) / 10);
}

function refreshSetList() {
  const e = activeEntry();
  if (!e) return;
  const rows = document.querySelectorAll('.set-list .set-row');
  e.sets.forEach((x, i) => {
    const cell = rows[i] && rows[i].children[1];
    if (cell) cell.innerHTML = setLabel(ex(e.exerciseId), x, e, i);
  });
}

function propagateWeight(value) {
  const e = activeEntry();
  const s = activeSet();
  if (!e || !s) return;
  const num = parseFloat(String(value).replace(',', '.'));
  const clean = Number.isNaN(num) ? 0 : Math.max(0, Math.round(num * 10) / 10);
  s.weight = clean;
  for (let i = e.activeSetIndex + 1; i < e.sets.length; i++) {
    if (!e.sets[i].done) e.sets[i].weight = clean;
  }
  save();
  refreshSetList();
}

function setReps(r) {
  const e = activeEntry();
  const s = activeSet();
  if (!e || !s) return;
  s.reps = r;
  for (let i = e.activeSetIndex + 1; i < e.sets.length; i++) {
    if (!e.sets[i].done) e.sets[i].reps = r;
  }
  save();
  render();
}

function adjustSet(field, delta) {
  const e = activeEntry(), s = activeSet();
  if (!e || !s) return;
  s[field] = Math.max(field === 'reps' ? 1 : 0, Math.round(((Number(s[field]) || 0) + delta) * 10) / 10);
  save();
  render();
}

function addSet() {
  const e = activeEntry();
  if (!e) return;
  const ref = activeSet() || e.sets[e.sets.length - 1] || { weight: 15, reps: 10, seconds: 40 };
  e.sets.push({
    weight: ref.weight,
    reps: ref.reps,
    seconds: ref.seconds,
    done: false,
    partial: false
  });
  const firstPending = e.sets.findIndex(s => !s.done);
  if (firstPending !== -1) e.activeSetIndex = firstPending;
  save();
  render();
  toast('Serie añadida');
}
function removeSet() {
  const e = activeEntry();
  if (!e || e.sets.length <= 1) return;
  const lastIdx = e.sets.length - 1;
  if (e.sets[lastIdx].done) {
    toast('No puedes borrar una serie ya completada');
    return;
  }
  e.sets.pop();
  e.activeSetIndex = Math.min(e.activeSetIndex, e.sets.length - 1);
  save();
  render();
  toast('Serie eliminada');
}

function saveSet() {
  const w = state.active, e = activeEntry(), s = activeSet();
  if (!w || !e || !s) return;
  if (s.done) { toast('Bloque completo · usa ＋ Serie si quieres otra'); return; }
  const guardEx = ex(e.exerciseId);
  if (guardEx?.type === 'time') {
    const live = (s.accumulatedSec || 0) + (s.timerRunning ? Math.floor((Date.now() - s.timerStartedAt) / 1000) : 0);
    if (live <= 0) { toast('Inicia el cronómetro antes de guardar la plancha'); return; }
  }
  if (state.sound) unlockAudio();
  setWakeLock(true);
  const currentEx = ex(e.exerciseId);
  if (currentEx?.type === 'time' && s.timerRunning) {
    s.accumulatedSec += Math.max(0, Math.floor((Date.now() - s.timerStartedAt) / 1000));
    s.seconds = s.accumulatedSec;
    s.timerRunning = false;
    s.timerStartedAt = null;
  }
  if (currentEx?.type === 'time') s.seconds = s.accumulatedSec || s.seconds;
  s.done = true;
  w.setsLoggedCount++;
  let isPR = false;
  if (currentEx?.type === 'weight' && s.weight > 0) {
    const histMax = Math.max(0, ...state.history.flatMap(h => h.entries.filter(x => x.exerciseId === e.exerciseId)
      .flatMap(x => x.sets.filter(t => t.done).map(t => Number(t.weight) || 0))));
    const sessMax = Math.max(0, ...e.sets.filter(t => t !== s && t.done).map(t => Number(t.weight) || 0));
    isPR = histMax > 0 && s.weight > Math.max(histMax, sessMax);
  }
  s.pr = isPR;

  if (e.activeSetIndex < e.sets.length - 1) {
    const next = e.sets[++e.activeSetIndex];
    next.weight = s.weight;
    next.reps = s.reps;
    next.seconds = s.seconds;
  } else if (w.currentIndex < w.entries.length - 1) {
    w.currentIndex++;
  }

  const restSeconds = currentEx?.restSec || (state.quick ? 60 : 90);
  w.restTotal = restSeconds;
  w.restDeadline = Date.now() + restSeconds * 1000;
  w.restPausedRemaining = null;
  w.restFinished = false;
  save();
  render();
  if (isPR) {
    toast(`🏆 ¡RÉCORD! ${s.weight} kg en ${currentEx.name}. Esto ya es una gira mundial 💅`);
  } else if (w.setsLoggedCount % 2 === 1) {
    const cheers = [
      'Deborah Vance: "Not bad, kid. Now do it again." 💜',
      'Hoy Ava no ha tenido que tirarte el branzino al suelo 🐟✨',
      '¿Has terminado la serie y vas a hacer OTRA?! He met you and he was like… MORE?! 💅',
      'Let me back my tasty ass up… después de devorar esa serie 💅',
      'Ava Coleman ha aprobado la serie. No preguntes qué nota te puso 👀',
      'Barbara Howard: "My favorite B-word is BIBLE… and BICEPS" 🙏',
      '"Sweet baby Jesus and the grown one too", menudo levantamiento 🔥',
      'Fleabag mirando a cámara: ate and left no crumbs 👁️👄👁️',
      'Hair is everything; tu técnica en esta serie, también 💇‍♀️',
      'CLAIRE, IT’S FRENCH! (y ejecución impecable) 😌',
      'Olivia Colman dice que esa serie es puro arte contemporáneo 🖼️',
      '¡Representada! Esa serie ya tiene agencia 💅',
      'Magüi lo apunta todo: otra serie para tu mejor temporada.',
      'Serie completada, café imaginario en Luke’s ☕',
      'Lorelai celebra; Luke te recuerda que guardes las mancuernas.',
      'Tres puntos para Richmond; una serie para ti. El marcador mejora ⚽',
      'Bumpin’ that 💚 Esa serie ya está en rotación.',
      '365 party girl… justo después de 3 series de jalón 💚',
      'What Was That?! Lorde aprueba ese levantamiento 👀✨',
      '¡EEEAHÍ ESTÁ! La exclusiva: sí podías con ese peso 💅🔥'
    ];
    toast(cheers[Math.floor(Math.random() * cheers.length)]);
  }
}

function togglePlank() {
  const s = activeSet();
  if (!s) return;
  if (s.timerRunning) {
    s.accumulatedSec += Math.floor((Date.now() - s.timerStartedAt) / 1000);
    s.timerRunning = false;
    s.timerStartedAt = null;
    s.seconds = s.accumulatedSec;
  } else {
    s.timerRunning = true;
    s.timerStartedAt = Date.now();
  }
  save();
  render();
}
function resetPlank() {
  const s = activeSet();
  if (!s) return;
  s.accumulatedSec = 0;
  s.seconds = 0;
  s.timerRunning = false;
  s.timerStartedAt = null;
  save();
  render();
}
function moveExercise(n) {
  const w = state.active;
  if (!w) return;
  w.currentIndex = Math.max(0, Math.min(w.entries.length - 1, w.currentIndex + n));
  w.restFinished = false;
  save();
  render();
}

function finishWorkout() {
  const w = state.active;
  if (!w) return;
  const done = w.entries.flatMap(e => e.sets.filter(s => s.done).map(s => ({ exerciseId: e.exerciseId, set: s })));
  if (!done.length) {
    toast('Completa al menos una serie para guardar');
    return;
  }
  const pending = w.entries.reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
  if (pending) {
    modal(`
      <div class="row"><strong>¿Cómo guardamos?</strong><button class="btn small" onclick="closeModal()">Volver</button></div>
      <p class="muted">Tienes ${done.length} series completadas y ${pending} pendientes.</p>
      <button class="btn primary block" onclick="commitFinish(false)">Guardar solo las completadas</button>
      <button class="btn block" onclick="commitFinish(true)">Guardar pendientes como parciales</button>
    `);
    return;
  }
  commitFinish(false);
}

function commitFinish(partials) {
  const w = state.active;
  if (!w) return;
  const entries = [];
  let volume = 0, setsCount = 0;
  const prs = [];

  for (const e of w.entries) {
    const kept = partials ? e.sets : e.sets.filter(s => s.done);
    if (!kept.some(s => s.done)) continue;
    const exercise = ex(e.exerciseId);
    const prev = Math.max(0, ...state.history.flatMap(h =>
      h.entries.filter(x => x.exerciseId === e.exerciseId).flatMap(x => x.sets.filter(s => s.done).map(s => Number(s.weight) || 0))
    ));
    const nowMax = Math.max(0, ...kept.filter(s => s.done).map(s => Number(s.weight) || 0));
    if (exercise?.type === 'weight' && prev > 0 && nowMax > prev) {
      prs.push(`${exercise.name}: ${nowMax} kg`);
    }
    for (const s of kept) {
      if (s.done) {
        setsCount++;
        if (exercise?.type === 'weight') volume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
      }
    }
    entries.push({
      exerciseId: e.exerciseId,
      sets: kept.map(s => {
        const c = normalizeSet(s);
        if (exercise?.type === 'time') { c.weight = 0; c.reps = 0; }
        else if (exercise?.type === 'reps') { c.weight = 0; c.seconds = 0; }
        else c.seconds = 0;
        c.partial = !s.done;
        return c;
      })
    });
  }

  const duration = Math.max(1, Math.min(240, Math.round((Date.now() - w.startedAt) / 60000)));
  const session = { id: w.id, date: w.date, title: w.title, club: w.club, durationMin: duration, entries };
  const sameBefore = state.history.slice().reverse().sort((a, b) => b.date.localeCompare(a.date))
    .find(h => h.title === session.title);
  let compareHtml = '<p class="muted">Primera vez con esta rutina: ya tienes marca de referencia 💜</p>';
  if (sameBefore) {
    const volOf = h => h.entries.reduce((a, en) => a + (ex(en.exerciseId)?.type === 'weight'
      ? en.sets.filter(t => t.done).reduce((b, t) => b + (Number(t.weight) || 0) * (Number(t.reps) || 0), 0) : 0), 0);
    const setsOf = h => h.entries.reduce((a, en) => a + en.sets.filter(t => t.done).length, 0);
    const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '±');
    const pv = volOf(sameBefore), dv = volume - pv, ds = setsCount - setsOf(sameBefore), dm = duration - sameBefore.durationMin;
    const parts = [];
    if (pv > 0) parts.push(`Volumen <b>${sign(dv)}${Math.abs(Math.round((dv / pv) * 100))} %</b>`);
    parts.push(`Series <b>${sign(ds)}${Math.abs(ds)}</b>`);
    parts.push(`Tiempo <b>${sign(dm)}${Math.abs(dm)} min</b>`);
    compareHtml = `<div class="card" style="background:var(--panel2);padding:10px 12px"><div class="tiny">vs. tu última «${esc(session.title)}» (${esc(sameBefore.date)})</div><div style="margin-top:4px">${parts.join(' · ')}</div></div>`;
  }
  state.history.push(session);
  delete state.plans[w.date];
  state.active = null;
  clearInterval(interval);
  save();
  closeModal();
  render();

  window._lastSummary = `TwinkTwankTwunk · ${session.title}\n${session.date} · ${session.club}\n${duration} min · ${setsCount} series · ${Math.round(volume)} kg${prs.length ? '\nRécords: ' + prs.join(', ') : ''}`;
  modal(`
    <div class="eyebrow">Sesión guardada</div>
    <h2 class="title">¡Ahí está! 💅</h2>
    <p class="muted">${esc(session.title)} · ${duration} min · ${setsCount} series</p>
    <div class="kpis">
      <div class="kpi"><span>Volumen</span><strong>${Math.round(volume)}<small> kg</small></strong></div>
      <div class="kpi"><span>Récords</span><strong>${prs.length}</strong></div>
      <div class="kpi"><span>Series</span><strong>${setsCount}</strong></div>
    </div>
    ${prs.length ? `<p class="muted">🏆 ${esc(prs.join(' · '))}</p>` : ''}
    ${compareHtml}
    <button class="btn primary block" onclick="copySummary()">Copiar resumen</button>
    <button class="btn block" onclick="closeModal()">Listo</button>
  `);
}

async function copySummary() {
  const text = window._lastSummary || '';
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
    else throw new Error();
    toast('Resumen copiado');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('Resumen copiado'); } catch { toast('No se pudo copiar'); }
    ta.remove();
  }
}

function discard() {
  modal(`
    <strong>¿Descartar el entreno?</strong>
    <p class="muted">Se perderán las series de esta sesión.</p>
    <div class="row">
      <button class="btn" onclick="closeModal()">Volver</button>
      <button class="btn danger" onclick="state.active=null;save();closeModal();render()">Descartar</button>
    </div>
  `);
}

// --- VISTAS ---

  const activeCount = d.items.filter(x => x.included).length;
  return `

      <div>
        <div class="eyebrow">Mapa de sesión · Pre-check</div>
        <h1 class="title">${esc(d.title)}</h1>
      </div>
      <button class="btn small" onclick="state.draft=null;render()">← Volver</button>

    <div class="stack">
      ${d.items.map((item, idx) => {
        const exo = ex(item.exerciseId);
        const st = STATIONS.find(s => s.id === exo?.station);

          ? '<span class="badge prio">🔥 Prioritario</span>'
          : exo?.priority === 'opcional'

          <div class="draft-row ${item.included ? '' : 'excluded'}">
